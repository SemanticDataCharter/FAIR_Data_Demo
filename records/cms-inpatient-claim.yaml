key: cms-inpatient-claim
label: CMS Inpatient Claim
type: Cluster
description: 'One DE-SynPUF inpatient claim (2008-2010): the beneficiary and claim identifiers, the stay as the FHIR encounter by identifier with
  admission and discharge dates, provider and physicians, the payment, per diem, deductible and coinsurance amounts, utilization days, the DRG,
  the admitting diagnosis, up to ten diagnoses, six procedures and ten HCPCS codes as ICD-9-CM and HCPCS coded values. Members: Beneficiary Code
  (DESYNPUF_ID); Claim ID (CLM_ID); Claim Line Segment (SEGMENT); encounter (FHIR); Provider Institution (PRVDR_NUM); Claim Payment Amount; Primary
  Payer Claim Paid Amount; Attending Physician NPI (AT_PHYSN_NPI); Operating Physician NPI (OP_PHYSN_NPI); Other Physician NPI (OT_PHYSN_NPI);
  Blood Deductible Liability Amount; Claim Admission Date (CLM_ADMSN_DT); Beneficiary Discharge Date (NCH_BENE_DSCHRG_DT); Claim Pass-Through
  Per Diem Amount; Inpatient Deductible Amount; Part A Coinsurance Liability Amount; Claim Utilization Day Count (CLM_UTLZTN_DAY_CNT); Diagnosis
  Related Group Code (CLM_DRG_CD); Admitting Diagnosis; Claim Diagnosis 1; Claim Diagnosis 2; Claim Diagnosis 3; Claim Diagnosis 4; Claim Diagnosis
  5; Claim Diagnosis 6; Claim Diagnosis 7; Claim Diagnosis 8; Claim Diagnosis 9; Claim Diagnosis 10; Claim Procedure 1; Claim Procedure 2; Claim
  Procedure 3; Claim Procedure 4; Claim Procedure 5; Claim Procedure 6; Claim HCPCS 1; Claim HCPCS 2; Claim HCPCS 3; Claim HCPCS 4; Claim HCPCS
  5; Claim HCPCS 6; Claim HCPCS 7; Claim HCPCS 8; Claim HCPCS 9; Claim HCPCS 10.'
