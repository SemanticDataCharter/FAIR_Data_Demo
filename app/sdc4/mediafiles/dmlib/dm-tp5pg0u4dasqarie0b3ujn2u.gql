  (comp_zmpqfc6tb0o2hgu8qs6lj8tp:XdToken:SDC4Component { id: 'mc-zmpqfc6tb0o2hgu8qs6lj8tp', label: 'Are you pregnant now?', sdcType: 'XdToken', seq: '0000', description: 'A textual description of the person\'s current pregnancy status. Also known as: Current Pregnancy Indicator. NIH CDE Repository, steward Project 5, tinyId LiUWCWluP, NIH endorsed. Corrected from the NIH CDE Repository record, whose LOINC answer codes are each one off (Yes was bound to LA26683-5 Not pregnant, No to LA4489-6 Unknown, Unknown to LA15173-0 Pregnant); the record\'s own NCI Thesaurus meanings (C49488 Yes, C49487 No, C17998 Unknown) agree with the codes used here.', enumerations: 'Yes; No; Unknown' }),
