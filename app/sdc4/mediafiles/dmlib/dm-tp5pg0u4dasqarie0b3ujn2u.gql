  (comp_nwsj84veb6u9g1v0h2a3a793:XdToken:SDC4Component { id: 'mc-nwsj84veb6u9g1v0h2a3a793', label: 'Country of Birth (DMDBORN4)', sdcType: 'XdToken', seq: '0000', description: 'Whether the participant was born in the 50 US states or Washington, DC, or elsewhere (DMDBORN4).', enumerations: 'Born in 50 US states or Washington, DC; Others' }),
