key: nhanes-demographics
label: NHANES Demographics
type: Cluster
description: 'The participant''s demographics: the Default administrative gender and the NHANES gender code, the NIH CDE age with age in months
  for infants, race/ethnicity as the NIH CDE and as NHANES codes it, country of birth, citizenship, education and marital status as the NIH CDE
  and as NHANES codes them, pregnancy status, household size, the agency''s income range and the income-to-poverty ratio. Members: administrative-gender
  (Default); Gender (RIAGENDR); Age (NIH CDE); Age in Months at Screening (RIDAGEMN); Race/Ethnicity Self-Identification (NIH CDE); Race/Hispanic
  Origin with NH Asian (RIDRETH3); Country of Birth (DMDBORN4); Citizenship Status (DMDCITZN); Current Educational Attainment (NIH CDE); Education
  Level - Adults 20+ (DMDEDUC2); Marital Status (NIH CDE); Marital Status (DMDMARTL); Are you pregnant now? (NIH CDE); Pregnancy Status at Exam
  (RIDEXPRG); Veteran Status; Total Number of People in the Household (DMDHHSIZ); Annual Household Income (INDHHIN2); Ratio of Family Income to
  Poverty (INDFMPIR).'
source:
  name: NHANES 2017-2018
