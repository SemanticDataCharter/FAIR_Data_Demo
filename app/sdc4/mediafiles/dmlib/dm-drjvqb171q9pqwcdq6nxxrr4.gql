  (comp_s05ed5djo5r9jhgrbgqk21gl:XdToken:SDC4Component { id: 'mc-s05ed5djo5r9jhgrbgqk21gl', label: 'Country of Birth (DMDBORN4)', sdcType: 'XdToken', seq: '0000', description: 'Whether the participant was born in the 50 US states or Washington, DC, or elsewhere (DMDBORN4).', enumerations: 'Born in 50 US states or Washington, DC; Others' }),
  (comp_olnr1coww9up2f7pc1ctph28:XdToken:SDC4Component { id: 'mc-olnr1coww9up2f7pc1ctph28', label: 'Education Level - Adults 20+ (DMDEDUC2)', sdcType: 'XdToken', seq: '0000', description: 'The highest grade or level of school completed, adults 20 and over (DMDEDUC2). Kept beside the NIH CDE Current Educational Attainment it is mapped to.', enumerations: 'Less than 9th grade; 9-11th grade (includes 12th grade with no diploma); High school graduate/GED or equivalent; Some college or AA degree; College graduate or above' }),
