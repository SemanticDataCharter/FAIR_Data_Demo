key: nhanes-days-taken-medicine
label: Number of Days Taken Medicine (RXDDAYS)
type: XdCount
description: The number of days the participant has taken the medicine (RXDDAYS; 1 to 21,900 in the file). A refusal (77777) or don't know (99999)
  is carried as an Exceptional Value, not a number.
source:
