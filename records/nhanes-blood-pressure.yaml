key: nhanes-blood-pressure
label: NHANES Blood Pressure
type: Cluster
description: 'The blood pressure examination (BPX_J): the arm and cuff, the 60-second pulse as the FHIR heart rate by identifier and its regularity,
  the maximum inflation level, and up to three readings each as the FHIR blood pressure cluster. Members: Arm Selected (BPAARM); Coded Cuff Size
  (BPACSZ); heart-rate (FHIR); Pulse Regular or Irregular (BPXPULS); Maximum Inflation Level (BPXML1); Blood Pressure Reading 1; Blood Pressure
  Reading 2; Blood Pressure Reading 3.'
