key: nhanes-physical-functioning
label: NHANES Physical Functioning
type: Cluster
description: 'Physical functioning (PFQ_J): work limitation, equipment to walk, confusion or memory problems, and nine activity items on the four-point
  difficulty scale. Members: Limitations Keeping You from Working (PFQ049); Need Special Equipment to Walk (PFQ054); Experience Confusion or Memory
  Problems (PFQ057); Difficulty Walking a Quarter Mile (PFQ061B); Difficulty Walking Up Ten Stairs (PFQ061C); Difficulty Stooping, Crouching or
  Kneeling (PFQ061D); Difficulty Lifting or Carrying (PFQ061E); Difficulty Walking Between Rooms (PFQ061H); Difficulty Standing Up from an Armless
  Chair (PFQ061I); Difficulty Getting In and Out of Bed (PFQ061J); Difficulty Dressing Yourself (PFQ061L); Difficulty Standing for Long Periods
  (PFQ061M).'
