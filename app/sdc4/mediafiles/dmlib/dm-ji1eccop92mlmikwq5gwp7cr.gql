  (comp_pxa2yzf6codttkyfa7nyx2ei:XdQuantity:SDC4Component { id: 'mc-pxa2yzf6codttkyfa7nyx2ei', label: 'Inpatient Deductible Amount', sdcType: 'XdQuantity', seq: '0000', description: 'The beneficiary\'s inpatient deductible (NCH_BENE_IP_DDCTBL_AMT), in US dollars.', totalDigits: '12', fractionDigits: '2' }),
