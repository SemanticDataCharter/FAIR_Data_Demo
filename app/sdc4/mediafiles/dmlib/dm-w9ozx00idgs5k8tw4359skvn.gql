  // --- Model-enriched structural data ---
  (dm_w9ozx00idgs5k8tw4359skvn:DataModel { id: 'dm-w9ozx00idgs5k8tw4359skvn', label: 'BRFSS Respondent 4.2.3', sdcType: 'DataModel', description: 'SDC4 data model for Behavioral Risk Factor Surveillance System (brfss) — FAIR Data Demo', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal' }),
  (cluster_kb26is7epmdlc0lm1k9pdz9f:Cluster:SDC4Component { id: 'mc-kb26is7epmdlc0lm1k9pdz9f', label: 'BRFSS Respondent Governed Record', sdcType: 'Cluster', description: 'A BRFSS respondent record. The governed record: the data cluster, the PROV activity and agent and the audit event from the ProvGov library by identifier. Members: BRFSS Respondent; prov-activity (Provgov); prov-agent (Provgov); audit-event (Provgov).' }),
  (cluster_t2tvd3wylxrstdeu5aw6gkw1:Cluster:SDC4Component { id: 'mc-t2tvd3wylxrstdeu5aw6gkw1', label: 'Audit Event', sdcType: 'Cluster', description: 'A logged access or custody event as data: what was done, by whom, on what, with what outcome and for what purpose. The audit-only case of sdc5 issue 002; state-changing operations are workflow transitions.' }),
  (comp_dkc2ccj5te35z9gd4bu1blcq:XdString:SDC4Component { id: 'mc-dkc2ccj5te35z9gd4bu1blcq', label: 'Audit Agent Reference', sdcType: 'XdString', seq: '0000', description: 'The acting agent (FHIR AuditEvent.agent.who). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_gcjyjrnp0wsfoelcp4m05c67:XdString:SDC4Component { id: 'mc-gcjyjrnp0wsfoelcp4m05c67', label: 'Audit Entity Reference', sdcType: 'XdString', seq: '0000', description: 'The entity the event concerns (FHIR AuditEvent.entity.what). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_fjhgr5fyqxt2crmg2cb5c513:XdString:SDC4Component { id: 'mc-fjhgr5fyqxt2crmg2cb5c513', label: 'Audit Event Identifier', sdcType: 'XdString', seq: '0000', description: 'The identifier of the audit event.', maxLength: '255' }),
  (comp_sndpbhm3xbd6qtbyxmvh3i0e:XdString:SDC4Component { id: 'mc-sndpbhm3xbd6qtbyxmvh3i0e', label: 'Data Subject Reference', sdcType: 'XdString', seq: '0000', description: 'The data subject or patient the event concerns (FHIR AuditEvent.patient; SDC DM.subject). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_nf1air1zbj8v9w66jozdxmyl:XdString:SDC4Component { id: 'mc-nf1air1zbj8v9w66jozdxmyl', label: 'On Behalf Of Reference', sdcType: 'XdString', seq: '0000', description: 'The party on whose behalf the agent acted (FHIR agent.onBehalfOf; prov:actedOnBehalfOf). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_h3kdbvdtyalpvik97saaf0an:XdString:SDC4Component { id: 'mc-h3kdbvdtyalpvik97saaf0an', label: 'System Identifier', sdcType: 'XdString', seq: '0000', description: 'The system that handled the item (FHIR AuditEvent.source.observer; SDC AuditType.system-id).', maxLength: '255' }),
  (comp_ujir739mf1g8ajeczs9nzh9m:XdString:SDC4Component { id: 'mc-ujir739mf1g8ajeczs9nzh9m', label: 'System Location Name', sdcType: 'XdString', seq: '0000', description: 'The site or facility that handled the item (FHIR AuditEvent.agent.location; prov:atLocation).', maxLength: '255' }),
  (comp_ce1c8sydkov8bkv4dgdmwe5x:XdToken:SDC4Component { id: 'mc-ce1c8sydkov8bkv4dgdmwe5x', label: 'Audit Event Action', sdcType: 'XdToken', seq: '0000', description: 'The operation performed in a logged access event (FHIR AuditEvent.action). Read and Execute change no state and are audit facts, not workflow moves.', enumerations: 'C; R; U; D; E' }),
  (comp_rpz1czz06jhpahmfz30rblvp:XdToken:SDC4Component { id: 'mc-rpz1czz06jhpahmfz30rblvp', label: 'Audit Event Outcome', sdcType: 'XdToken', seq: '0000', description: 'The result of an audited event (FHIR AuditEvent.outcome).', enumerations: '0; 4; 8; 12' }),
  (comp_vbctgmdcwps5b3r3l6sboa6y:XdToken:SDC4Component { id: 'mc-vbctgmdcwps5b3r3l6sboa6y', label: 'Confidentiality', sdcType: 'XdToken', seq: '0000', description: 'The level of protection the information requires (HL7 v3 Confidentiality). At assembly the value populates a component\'s act tag.', enumerations: 'U; L; M; N; R; V' }),
  (comp_jujsdur1igws8orw6tvvlqco:XdToken:SDC4Component { id: 'mc-jujsdur1igws8orw6tvvlqco', label: 'Provenance Agent Type', sdcType: 'XdToken', seq: '0000', description: 'The functional role of an agent in an activity (FHIR Provenance.agent.type).', enumerations: 'enterer; performer; author; editor; verifier; legal; attester; informant; custodian; transmitter; assembler; transformer; composer' }),
  (comp_d1evlz8yvdlwt6ia9fjq4pgj:XdToken:SDC4Component { id: 'mc-d1evlz8yvdlwt6ia9fjq4pgj', label: 'Purpose of Use', sdcType: 'XdToken', seq: '0000', description: 'Why the information was used (HL7 v3 ActReason purpose of use). Activity context, not an access-control tag.', enumerations: 'TREAT; ETREAT; COC; HPAYMT; HOPERAT; HRESCH; CLINTRCH; PUBHLTH; PATRQT; HLEGAL; HMARKT' }),
  (comp_uwiosm2q9ym3ewr4de910s70:XdTemporal:SDC4Component { id: 'mc-uwiosm2q9ym3ewr4de910s70', label: 'Audit Recorded At', sdcType: 'XdTemporal', seq: '0000', description: 'When the audit event was recorded (FHIR AuditEvent.recorded).' }),
  (cluster_jxif4jju7k2rg3vokabzzj22:Cluster:SDC4Component { id: 'mc-jxif4jju7k2rg3vokabzzj22', label: 'BRFSS Respondent', sdcType: 'Cluster', description: 'One BRFSS 2022 respondent: the sequence number, survey design, demographics, health status and access, chronic conditions, body measures, tobacco and alcohol, and disability, from the columns of the LLCP2022 file this demonstration carries. Members: Annual Sequence Number (SEQNO); BRFSS Survey Design; BRFSS Demographics; BRFSS Health Status and Access; BRFSS Chronic Conditions; BRFSS Body Measures; BRFSS Tobacco and Alcohol Use; BRFSS Disability.' }),
  (comp_pflduyrah1tnmmsjrwfvi121:XdString:SDC4Component { id: 'mc-pflduyrah1tnmmsjrwfvi121', label: 'Annual Sequence Number (SEQNO)', sdcType: 'XdString', seq: '0000', description: 'The BRFSS annual sequence number identifying the respondent within the year (SEQNO).', maxLength: '12', pattern: '[0-9]{10}' }),
  (cluster_gc3nb6hzobkzifswmzgt7w6t:Cluster:SDC4Component { id: 'mc-gc3nb6hzobkzifswmzgt7w6t', label: 'BRFSS Body Measures', sdcType: 'Cluster', description: 'Self-reported height and weight as the agency codes them, and as the FHIR vital signs panel by identifier (body height, body weight, BMI), with the agency\'s computed BMI category. Members: Reported Height in Feet and Inches (HEIGHT3); Reported Weight in Pounds (WEIGHT2); vital-signs-panel (FHIR); Computed Body Mass Index Category (_BMI5CAT).' }),
  (comp_urjk1vvcot1s319mxygpdsf5:XdString:SDC4Component { id: 'mc-urjk1vvcot1s319mxygpdsf5', label: 'Reported Height in Feet and Inches (HEIGHT3)', sdcType: 'XdString', seq: '0000', description: 'Self-reported height as coded (HEIGHT3: feet and inches as FII, or 9xxx for metres and centimetres). The FHIR body height beside it carries the value in centimetres.', maxLength: '4', pattern: '[0-9]{3,4}' }),
  (comp_ezewpvppvx8zjikutr53ppgz:XdToken:SDC4Component { id: 'mc-ezewpvppvx8zjikutr53ppgz', label: 'Computed Body Mass Index Category (_BMI5CAT)', sdcType: 'XdToken', seq: '0000', description: 'The agency\'s computed BMI category (_BMI5CAT).', enumerations: 'Underweight; Normal Weight; Overweight; Obese' }),
  (comp_gket571isxo2uckturhvxadk:XdQuantity:SDC4Component { id: 'mc-gket571isxo2uckturhvxadk', label: 'Reported Weight in Pounds (WEIGHT2)', sdcType: 'XdQuantity', seq: '0000', description: 'Self-reported weight without shoes, in pounds as reported (WEIGHT2; the agency\'s kilogram reports are converted). The FHIR body weight beside it carries the same value in kilograms.', minInclusive: '50.00000', maxInclusive: '999.00000', totalDigits: '4', fractionDigits: '0' }),
  (comp_sdlc6bf161fyyueaca8vvshh:Units:SDC4Component { id: 'mc-sdlc6bf161fyyueaca8vvshh', label: 'Mass/Weight (US Customary)', sdcType: 'Units' }),
  (cluster_atvd5lzut4pjzc7dpv1ykb92:Cluster:SDC4Component { id: 'mc-atvd5lzut4pjzc7dpv1ykb92', label: 'Vital Signs Panel', sdcType: 'Cluster', description: 'The vital signs of one measurement session: height, weight, temperature, heart and respiratory rate, oxygen saturation, BMI and blood pressure.' }),
  (comp_q9vmn1cvdclgr757aer5v1rg:XdToken:SDC4Component { id: 'mc-q9vmn1cvdclgr757aer5v1rg', label: 'Observation Status', sdcType: 'XdToken', seq: '0000', description: 'The status of the observation result. FHIR Observation.status; ObservationStatus, version 4.0.1.', enumerations: 'registered; preliminary; final; amended; corrected; cancelled; entered-in-error; unknown' }),
  (comp_z1ezf3vzksp7qpgd9l3uxvqo:XdQuantity:SDC4Component { id: 'mc-z1ezf3vzksp7qpgd9l3uxvqo', label: 'Body Height', sdcType: 'XdQuantity', seq: '0000', description: 'Body Height (LOINC 8302-2), in the Default units by slot. FHIR Observation.valueQuantity.', minInclusive: '0.00000', totalDigits: '5', fractionDigits: '1' }),
