  (comp_fjhgr5fyqxt2crmg2cb5c513:XdString:SDC4Component { id: 'mc-fjhgr5fyqxt2crmg2cb5c513', label: 'Audit Event Identifier', sdcType: 'XdString', seq: '0000', description: 'The identifier of the audit event.', maxLength: '255' }),
  (comp_sndpbhm3xbd6qtbyxmvh3i0e:XdString:SDC4Component { id: 'mc-sndpbhm3xbd6qtbyxmvh3i0e', label: 'Data Subject Reference', sdcType: 'XdString', seq: '0000', description: 'The data subject or patient the event concerns (FHIR AuditEvent.patient; SDC DM.subject). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_nf1air1zbj8v9w66jozdxmyl:XdString:SDC4Component { id: 'mc-nf1air1zbj8v9w66jozdxmyl', label: 'On Behalf Of Reference', sdcType: 'XdString', seq: '0000', description: 'The party on whose behalf the agent acted (FHIR agent.onBehalfOf; prov:actedOnBehalfOf). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_h3kdbvdtyalpvik97saaf0an:XdString:SDC4Component { id: 'mc-h3kdbvdtyalpvik97saaf0an', label: 'System Identifier', sdcType: 'XdString', seq: '0000', description: 'The system that handled the item (FHIR AuditEvent.source.observer; SDC AuditType.system-id).', maxLength: '255' }),
  (comp_ujir739mf1g8ajeczs9nzh9m:XdString:SDC4Component { id: 'mc-ujir739mf1g8ajeczs9nzh9m', label: 'System Location Name', sdcType: 'XdString', seq: '0000', description: 'The site or facility that handled the item (FHIR AuditEvent.agent.location; prov:atLocation).', maxLength: '255' }),
  (comp_ce1c8sydkov8bkv4dgdmwe5x:XdToken:SDC4Component { id: 'mc-ce1c8sydkov8bkv4dgdmwe5x', label: 'Audit Event Action', sdcType: 'XdToken', seq: '0000', description: 'The operation performed in a logged access event (FHIR AuditEvent.action). Read and Execute change no state and are audit facts, not workflow moves.', enumerations: 'C; R; U; D; E' }),
  (comp_rpz1czz06jhpahmfz30rblvp:XdToken:SDC4Component { id: 'mc-rpz1czz06jhpahmfz30rblvp', label: 'Audit Event Outcome', sdcType: 'XdToken', seq: '0000', description: 'The result of an audited event (FHIR AuditEvent.outcome).', enumerations: '0; 4; 8; 12' }),
  (comp_vbctgmdcwps5b3r3l6sboa6y:XdToken:SDC4Component { id: 'mc-vbctgmdcwps5b3r3l6sboa6y', label: 'Confidentiality', sdcType: 'XdToken', seq: '0000', description: 'The level of protection the information requires (HL7 v3 Confidentiality). At assembly the value populates a component\'s act tag.', enumerations: 'U; L; M; N; R; V' }),
  (comp_jujsdur1igws8orw6tvvlqco:XdToken:SDC4Component { id: 'mc-jujsdur1igws8orw6tvvlqco', label: 'Provenance Agent Type', sdcType: 'XdToken', seq: '0000', description: 'The functional role of an agent in an activity (FHIR Provenance.agent.type).', enumerations: 'enterer; performer; author; editor; verifier; legal; attester; informant; custodian; transmitter; assembler; transformer; composer' }),
  (comp_d1evlz8yvdlwt6ia9fjq4pgj:XdToken:SDC4Component { id: 'mc-d1evlz8yvdlwt6ia9fjq4pgj', label: 'Purpose of Use', sdcType: 'XdToken', seq: '0000', description: 'Why the information was used (HL7 v3 ActReason purpose of use). Activity context, not an access-control tag.', enumerations: 'TREAT; ETREAT; COC; HPAYMT; HOPERAT; HRESCH; CLINTRCH; PUBHLTH; PATRQT; HLEGAL; HMARKT' }),
  (comp_uwiosm2q9ym3ewr4de910s70:XdTemporal:SDC4Component { id: 'mc-uwiosm2q9ym3ewr4de910s70', label: 'Audit Recorded At', sdcType: 'XdTemporal', seq: '0000', description: 'When the audit event was recorded (FHIR AuditEvent.recorded).' }),
  (cluster_pgn54ip279evo9nxul6bsw2d:Cluster:SDC4Component { id: 'mc-pgn54ip279evo9nxul6bsw2d', label: 'NHANES Medication', sdcType: 'Cluster', description: 'One prescription medicine a participant reported (RXQ_RX_J): the sequence number joining it to the participant, whether any was taken, the generic name and NHANES code, days taken, the count of medicines, and up to three reasons as ICD-10-CM coded values. Members: Respondent Sequence Number (SEQN); Taken Prescription Medicine, Past Month (RXDUSE); Generic Drug Name (RXDDRUG); Generic Drug Code (RXDDRGID); Number of Days Taken Medicine (RXDDAYS); Number of Prescription Medicines Taken (RXDCOUNT); Medication Reason 1; Medication Reason 2; Medication Reason 3.' }),
  (comp_wypildaam8rrd87zkkjxl732:XdString:SDC4Component { id: 'mc-wypildaam8rrd87zkkjxl732', label: 'Generic Drug Code (RXDDRGID)', sdcType: 'XdString', seq: '0000', description: 'The NHANES generic drug code (RXDDRGID), the agency\'s own identifier from the Lexicon Plus database; not an RxNorm code, so it is not presented as one.', maxLength: '12' }),
  (comp_aut5uvzn0y8wb9xj2ox2n4wh:XdString:SDC4Component { id: 'mc-aut5uvzn0y8wb9xj2ox2n4wh', label: 'Generic Drug Name (RXDDRUG)', sdcType: 'XdString', seq: '0000', description: 'The generic drug name as NHANES records it (RXDDRUG).', maxLength: '200' }),
  (comp_uto4zszvpicva38wx77knz5y:XdString:SDC4Component { id: 'mc-uto4zszvpicva38wx77knz5y', label: 'Respondent Sequence Number (SEQN)', sdcType: 'XdString', seq: '0000', description: 'The NHANES respondent sequence number, the identifier every NHANES file carries for a participant (SEQN).', maxLength: '8', pattern: '[0-9]{5,6}' }),
  (comp_a1zr74c1vayeeglk54da7gaf:XdToken:SDC4Component { id: 'mc-a1zr74c1vayeeglk54da7gaf', label: 'Taken Prescription Medicine, Past Month (RXDUSE)', sdcType: 'XdToken', seq: '0000', description: 'Whether the participant took prescription medicine in the past 30 days (RXDUSE).', enumerations: 'Yes; No' }),
  (comp_jybwb4302jxgp028dyk2cgmt:XdCount:SDC4Component { id: 'mc-jybwb4302jxgp028dyk2cgmt', label: 'Number of Days Taken Medicine (RXDDAYS)', sdcType: 'XdCount', seq: '0000', description: 'The number of days the participant has taken the medicine (RXDDAYS; 1 to 21,900 in the file). A refusal (77777) or don\'t know (99999) is carried as an Exceptional Value, not a number.', minInclusive: '1.00000', maxInclusive: '21900.00000' }),
  (comp_yht0x4rmqyu32sd90jl0rzbo:Units:SDC4Component { id: 'mc-yht0x4rmqyu32sd90jl0rzbo', label: 'Days', sdcType: 'Units' }),
  (comp_v28gzpjsaxkkgjm470icwipg:XdCount:SDC4Component { id: 'mc-v28gzpjsaxkkgjm470icwipg', label: 'Number of Prescription Medicines Taken (RXDCOUNT)', sdcType: 'XdCount', seq: '0000', description: 'The number of prescription medicines the participant is taking (RXDCOUNT).', minInclusive: '0.00000', maxInclusive: '50.00000' }),
  (comp_c3ycqqk7ns1bvmsc0ricnsbn:Units:SDC4Component { id: 'mc-c3ycqqk7ns1bvmsc0ricnsbn', label: 'Items', sdcType: 'Units' }),
  (cluster_rgrfnzoti0vquavt7m32mf8k:Cluster:SDC4Component { id: 'mc-rgrfnzoti0vquavt7m32mf8k', label: 'Medication Reason 1', sdcType: 'Cluster', description: 'The first reason the medicine is taken (RXDRSC1, RXDRSD1): an ICD-10-CM diagnosis as the FHIR coded value by identifier, or one of NHANES\'s prevention reason codes, which are not ICD-10-CM. Members: diagnosis-icd10cm (FHIR); Prevention Reason (NHANES).' }),
  (cluster_eijlau8c1zoa8fbw8fmy0ir4:Cluster:SDC4Component { id: 'mc-eijlau8c1zoa8fbw8fmy0ir4', label: 'Diagnosis (ICD-10-CM)', sdcType: 'Cluster', description: 'The condition, problem or diagnosis. A coded value: the ICD-10-CM code, its display text and the fixed code system, resolved on the code system IRI (FHIR Coding). FHIR Condition.code.' }),
  (comp_jwgx8nvbtsim7ck4uqmpqyl2:XdLink:SDC4Component { id: 'mc-jwgx8nvbtsim7ck4uqmpqyl2', label: 'Code System: ICD-10-CM', sdcType: 'XdLink', seq: '0000', description: 'The code system of a coded value, fixed: ICD-10-CM (http://hl7.org/fhir/sid/icd-10-cm). FHIR Coding.system.' }),
  (comp_eo5tlfr0576ypknys5alvcn0:XdString:SDC4Component { id: 'mc-eo5tlfr0576ypknys5alvcn0', label: 'Code Display Text', sdcType: 'XdString', seq: '0000', description: 'The human-readable display of a coded value, as recorded with the code (FHIR Coding.display).', maxLength: '500' }),
  (comp_km7yfw4egxchlb92ya8cqurd:XdString:SDC4Component { id: 'mc-km7yfw4egxchlb92ya8cqurd', label: 'Diagnosis Code (ICD-10-CM)', sdcType: 'XdString', seq: '0000', description: 'The ICD-10-CM code for the condition, problem or diagnosis. FHIR Condition.code, coded in http://hl7.org/fhir/sid/icd-10-cm.', maxLength: '40', pattern: '[A-TV-Z][0-9][0-9AB](\\.[0-9A-TV-Z]{1,4})?' }),
  (cluster_fyurnfjn767pebwima5aq1ek:Cluster:SDC4Component { id: 'mc-fyurnfjn767pebwima5aq1ek', label: 'Prevention Reason (NHANES)', sdcType: 'Cluster', description: 'A reason for a medicine coded in NHANES\'s prevention reason codes: the code, NHANES\'s description of it and the fixed code system (FHIR Coding). Kept apart from the ICD-10-CM diagnosis because the code is not ICD-10-CM and the condition is one the participant is preventing, not one diagnosed. Members: Prevention Reason Code (NHANES); code-display-text (FHIR); Code System: NHANES Prevention Reason.' }),
  (comp_m5mmhesnjwbf52fwdo8jzqxp:XdLink:SDC4Component { id: 'mc-m5mmhesnjwbf52fwdo8jzqxp', label: 'Code System: NHANES Prevention Reason', sdcType: 'XdLink', seq: '0000', description: 'The code system of a coded value, fixed: NHANES\'s prevention reason codes, defined in the RXQ_RX_J documentation (https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2017/DataFiles/RXQ_RX_J.htm). Not ICD-10-CM. FHIR Coding.system.' }),
  (comp_fkfgjboicxhcx4j0l7jhqw42:XdString:SDC4Component { id: 'mc-fkfgjboicxhcx4j0l7jhqw42', label: 'Prevention Reason Code (NHANES)', sdcType: 'XdString', seq: '0000', description: 'An NHANES prevention reason code (RXDRSC1 to RXDRSC3): an ICD-10-CM code with the letter P appended, meaning the medicine is taken to prevent the condition (I21.P, prevent heart attack). NHANES\'s own code, not an ICD-10-CM code: ICD-10-CM has no I21.P.', maxLength: '8', pattern: '[A-TV-Z][0-9][0-9AB][.][0-9A-TV-Z]{0,3}P' }),
  (cluster_zljaiuq15yi0ow5y1l7luzoy:Cluster:SDC4Component { id: 'mc-zljaiuq15yi0ow5y1l7luzoy', label: 'Medication Reason 2', sdcType: 'Cluster', description: 'The second reason the medicine is taken (RXDRSC2, RXDRSD2): an ICD-10-CM diagnosis as the FHIR coded value by identifier, or one of NHANES\'s prevention reason codes, which are not ICD-10-CM. Members: diagnosis-icd10cm (FHIR); Prevention Reason (NHANES).' }),
  (cluster_mwmrnudjznage2exv6e8v0ws:Cluster:SDC4Component { id: 'mc-mwmrnudjznage2exv6e8v0ws', label: 'Medication Reason 3', sdcType: 'Cluster', description: 'The third reason the medicine is taken (RXDRSC3, RXDRSD3): an ICD-10-CM diagnosis as the FHIR coded value by identifier, or one of NHANES\'s prevention reason codes, which are not ICD-10-CM. Members: diagnosis-icd10cm (FHIR); Prevention Reason (NHANES).' }),
  (cluster_vmikfu0irht9fmq7q02t3oqs:Cluster:SDC4Component { id: 'mc-vmikfu0irht9fmq7q02t3oqs', label: 'PROV Activity', sdcType: 'Cluster', description: 'A PROV activity: what it was, when it ran, its status, and the entities, activities, agent and plan it relates to.' }),
