# FAIR Data Demo — SDC Agents Configuration
# ===========================================
# Configures 13 datasources across 3 federal health studies for the FAIR
# interoperability demo. Requires a running SDCStudio instance and API key.
#
# Set environment variables:
#   SDCSTUDIO_URL  — SDCStudio base URL (default: https://sdcstudio.axius-sdc.com)
#   SDC_API_KEY    — API token for Catalog, Assembly, and VaaS APIs

sdcstudio:
  base_url: "${SDCSTUDIO_URL}"
  api_key: "${SDC_API_KEY}"
  default_library_project: "NIH-CDE"

cache:
  root: ".sdc-cache"
  ttl_hours: 168

audit:
  path: ".sdc-cache/audit.jsonl"
  log_level: "verbose"

# ---------------------------------------------------------------------------
# Datasources — 13 datasets across 3 federal health studies
# ---------------------------------------------------------------------------
# NHANES XPT files must be converted to CSV first (scripts/convert_xpt_to_csv.py).
# BRFSS XPT file must also be converted. CMS data is already CSV.

datasources:
  # --- NHANES (8 datasets) ---
  nhanes_demographics:
    type: csv
    path: "source_data/nhanes/DEMO_J.csv"
    metadata_path: "source_data/nhanes/DEMO_J.json"
  nhanes_blood_pressure:
    type: csv
    path: "source_data/nhanes/BPX_J.csv"
    metadata_path: "source_data/nhanes/BPX_J.json"
  nhanes_cbc:
    type: csv
    path: "source_data/nhanes/CBC_J.csv"
    metadata_path: "source_data/nhanes/CBC_J.json"
  nhanes_cholesterol:
    type: csv
    path: "source_data/nhanes/TCHOL_J.csv"
    metadata_path: "source_data/nhanes/TCHOL_J.json"
  nhanes_medications:
    type: csv
    path: "source_data/nhanes/RXQ_RX_J.csv"
    metadata_path: "source_data/nhanes/RXQ_RX_J.json"
  nhanes_medical_conditions:
    type: csv
    path: "source_data/nhanes/MCQ_J.csv"
    metadata_path: "source_data/nhanes/MCQ_J.json"
  nhanes_smoking:
    type: csv
    path: "source_data/nhanes/SMQ_J.csv"
    metadata_path: "source_data/nhanes/SMQ_J.json"
  nhanes_physical_functioning:
    type: csv
    path: "source_data/nhanes/PFQ_J.csv"
    metadata_path: "source_data/nhanes/PFQ_J.json"

  # --- BRFSS (1 dataset) ---
  brfss:
    type: csv
    path: "source_data/brfss/LLCP2022.csv"
    metadata_path: "source_data/brfss/LLCP2022.json"

  # --- CMS DE-SynPUF (4 datasets, Sample 1 only) ---
  cms_beneficiary:
    type: csv
    path: "source_data/cms/DE1_0_2008_Beneficiary_Summary_File_Sample_1.csv"
  cms_inpatient:
    type: csv
    path: "source_data/cms/DE1_0_2008_to_2010_Inpatient_Claims_Sample_1.csv"
  cms_outpatient:
    type: csv
    path: "source_data/cms/DE1_0_2008_to_2010_Outpatient_Claims_Sample_1.csv"
  cms_prescriptions:
    type: csv
    path: "source_data/cms/DE1_0_2008_to_2010_Prescription_Drug_Events_Sample_1.csv"

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------

output:
  directory: "output/instances"
  formats:
    - xml

# ---------------------------------------------------------------------------
# Destinations
# ---------------------------------------------------------------------------

destinations:
  graphdb:
    type: graphdb
    endpoint: "http://localhost:7200"
    repository: "fair_demo"
