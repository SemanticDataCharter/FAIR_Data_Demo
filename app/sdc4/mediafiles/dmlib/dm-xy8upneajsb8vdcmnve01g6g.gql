  // --- Model-enriched structural data ---
  (dm_xy8upneajsb8vdcmnve01g6g:DataModel { id: 'dm-xy8upneajsb8vdcmnve01g6g', label: 'NHANES Participant', sdcType: 'DataModel', description: 'SDC4 data model for National Health and Nutrition Examination Survey (nhanes_blood_pressure) — FAIR Data Demo', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal' }),
  (cluster_l6t9agg233vswxyv60quiu6w:Cluster:SDC4Component { id: 'mc-l6t9agg233vswxyv60quiu6w', label: 'NHANES Participant Governed Record', sdcType: 'Cluster', description: 'An NHANES participant record. The governed record: the data cluster, the PROV activity and agent and the audit event from the ProvGov library by identifier. Members: NHANES Participant; prov-activity (Provgov); prov-agent (Provgov); audit-event (Provgov).' }),
  (cluster_t2tvd3wylxrstdeu5aw6gkw1:Cluster:SDC4Component { id: 'mc-t2tvd3wylxrstdeu5aw6gkw1', label: 'Audit Event', sdcType: 'Cluster', description: 'A logged access or custody event as data: what was done, by whom, on what, with what outcome and for what purpose. The audit-only case of sdc5 issue 002; state-changing operations are workflow transitions.' }),
  (comp_dkc2ccj5te35z9gd4bu1blcq:XdString:SDC4Component { id: 'mc-dkc2ccj5te35z9gd4bu1blcq', label: 'Audit Agent Reference', sdcType: 'XdString', seq: '0000', description: 'The acting agent (FHIR AuditEvent.agent.who). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_gcjyjrnp0wsfoelcp4m05c67:XdString:SDC4Component { id: 'mc-gcjyjrnp0wsfoelcp4m05c67', label: 'Audit Entity Reference', sdcType: 'XdString', seq: '0000', description: 'The entity the event concerns (FHIR AuditEvent.entity.what). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_fjhgr5fyqxt2crmg2cb5c513:XdString:SDC4Component { id: 'mc-fjhgr5fyqxt2crmg2cb5c513', label: 'Audit Event Identifier', sdcType: 'XdString', seq: '0000', description: 'The identifier of the audit event.', maxLength: '255' }),
  (comp_sndpbhm3xbd6qtbyxmvh3i0e:XdString:SDC4Component { id: 'mc-sndpbhm3xbd6qtbyxmvh3i0e', label: 'Data Subject Reference', sdcType: 'XdString', seq: '0000', description: 'The data subject or patient the event concerns (FHIR AuditEvent.patient; SDC DM.subject). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_nf1air1zbj8v9w66jozdxmyl:XdString:SDC4Component { id: 'mc-nf1air1zbj8v9w66jozdxmyl', label: 'On Behalf Of Reference', sdcType: 'XdString', seq: '0000', description: 'The party on whose behalf the agent acted (FHIR agent.onBehalfOf; prov:actedOnBehalfOf). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_h3kdbvdtyalpvik97saaf0an:XdString:SDC4Component { id: 'mc-h3kdbvdtyalpvik97saaf0an', label: 'System Identifier', sdcType: 'XdString', seq: '0000', description: 'The system that handled the item (FHIR AuditEvent.source.observer; SDC AuditType.system-id).', maxLength: '255' }),
  (comp_ujir739mf1g8ajeczs9nzh9m:XdString:SDC4Component { id: 'mc-ujir739mf1g8ajeczs9nzh9m', label: 'System Location Name', sdcType: 'XdString', seq: '0000', description: 'The site or facility that handled the item (FHIR AuditEvent.agent.location; prov:atLocation).', maxLength: '255' }),
  (comp_ce1c8sydkov8bkv4dgdmwe5x:XdToken:SDC4Component { id: 'mc-ce1c8sydkov8bkv4dgdmwe5x', label: 'Audit Event Action', sdcType: 'XdToken', seq: '0000', description: 'The operation performed in a logged access event (FHIR AuditEvent.action). Read and Execute change no state and are audit facts, not workflow moves.', enumerations: 'C; R; U; D; E' }),
  (comp_rpz1czz06jhpahmfz30rblvp:XdToken:SDC4Component { id: 'mc-rpz1czz06jhpahmfz30rblvp', label: 'Audit Event Outcome', sdcType: 'XdToken', seq: '0000', description: 'The result of an audited event (FHIR AuditEvent.outcome).', enumerations: '0; 4; 8; 12' }),
  (comp_vbctgmdcwps5b3r3l6sboa6y:XdToken:SDC4Component { id: 'mc-vbctgmdcwps5b3r3l6sboa6y', label: 'Confidentiality', sdcType: 'XdToken', seq: '0000', description: 'The level of protection the information requires (HL7 v3 Confidentiality). At assembly the value populates a component\'s act tag.', enumerations: 'U; L; M; N; R; V' }),
  (comp_jujsdur1igws8orw6tvvlqco:XdToken:SDC4Component { id: 'mc-jujsdur1igws8orw6tvvlqco', label: 'Provenance Agent Type', sdcType: 'XdToken', seq: '0000', description: 'The functional role of an agent in an activity (FHIR Provenance.agent.type).', enumerations: 'enterer; performer; author; editor; verifier; legal; attester; informant; custodian; transmitter; assembler; transformer; composer' }),
  (comp_d1evlz8yvdlwt6ia9fjq4pgj:XdToken:SDC4Component { id: 'mc-d1evlz8yvdlwt6ia9fjq4pgj', label: 'Purpose of Use', sdcType: 'XdToken', seq: '0000', description: 'Why the information was used (HL7 v3 ActReason purpose of use). Activity context, not an access-control tag.', enumerations: 'TREAT; ETREAT; COC; HPAYMT; HOPERAT; HRESCH; CLINTRCH; PUBHLTH; PATRQT; HLEGAL; HMARKT' }),
  (comp_uwiosm2q9ym3ewr4de910s70:XdTemporal:SDC4Component { id: 'mc-uwiosm2q9ym3ewr4de910s70', label: 'Audit Recorded At', sdcType: 'XdTemporal', seq: '0000', description: 'When the audit event was recorded (FHIR AuditEvent.recorded).' }),
  (cluster_e3gwv95m8jjx7578urmx8ppz:Cluster:SDC4Component { id: 'mc-e3gwv95m8jjx7578urmx8ppz', label: 'NHANES Participant', sdcType: 'Cluster', description: 'One NHANES 2017-2018 participant: the sequence number, the survey design, demographics, the blood pressure examination, laboratory results, smoking, medical conditions and physical functioning, joined on SEQN across the eight source files. Members: Respondent Sequence Number (SEQN); NHANES Survey Design; NHANES Demographics; NHANES Blood Pressure; NHANES Laboratory Results; NHANES Smoking; NHANES Medical Conditions; NHANES Physical Functioning.' }),
  (comp_uto4zszvpicva38wx77knz5y:XdString:SDC4Component { id: 'mc-uto4zszvpicva38wx77knz5y', label: 'Respondent Sequence Number (SEQN)', sdcType: 'XdString', seq: '0000', description: 'The NHANES respondent sequence number, the identifier every NHANES file carries for a participant (SEQN).', maxLength: '8', pattern: '[0-9]{5,6}' }),
  (cluster_k8t5396w5kh1zzf6vhp4ola2:Cluster:SDC4Component { id: 'mc-k8t5396w5kh1zzf6vhp4ola2', label: 'NHANES Blood Pressure', sdcType: 'Cluster', description: 'The blood pressure examination (BPX_J): the arm and cuff, the 60-second pulse as the FHIR heart rate by identifier and its regularity, the maximum inflation level, and up to three readings each as the FHIR blood pressure cluster. Members: Arm Selected (BPAARM); Coded Cuff Size (BPACSZ); heart-rate (FHIR); Pulse Regular or Irregular (BPXPULS); Maximum Inflation Level (BPXML1); Blood Pressure Reading 1; Blood Pressure Reading 2; Blood Pressure Reading 3.' }),
  (comp_f98c865cpjza5wwh3odh9nv3:XdToken:SDC4Component { id: 'mc-f98c865cpjza5wwh3odh9nv3', label: 'Arm Selected (BPAARM)', sdcType: 'XdToken', seq: '0000', description: 'The arm the blood pressure was measured on (BPAARM).', enumerations: 'Right; Left' }),
  (comp_qv6ytjstrquvfr20cyfjqq2d:XdToken:SDC4Component { id: 'mc-qv6ytjstrquvfr20cyfjqq2d', label: 'Coded Cuff Size (BPACSZ)', sdcType: 'XdToken', seq: '0000', description: 'The blood pressure cuff size used (BPACSZ).', enumerations: 'Infant (9 x 18 cm); Child (12 x 22 cm); Adult (15 x 32 cm); Large (17 x 36 cm); Thigh (23 x 38 cm)' }),
  (comp_uy2fly38y0ghl10xgo4e7svh:XdToken:SDC4Component { id: 'mc-uy2fly38y0ghl10xgo4e7svh', label: 'Pulse Regular or Irregular (BPXPULS)', sdcType: 'XdToken', seq: '0000', description: 'Whether the pulse was regular or irregular (BPXPULS).', enumerations: 'Regular; Irregular' }),
  (comp_ujpg1m8po18ynniqpwhltxld:XdQuantity:SDC4Component { id: 'mc-ujpg1m8po18ynniqpwhltxld', label: 'Maximum Inflation Level (BPXML1)', sdcType: 'XdQuantity', seq: '0000', description: 'The maximum inflation level used, in mm Hg (BPXML1).', minInclusive: '0.00000', totalDigits: '3', fractionDigits: '0' }),
  (comp_an4r6ds6zhk334liqf3uhses:Units:SDC4Component { id: 'mc-an4r6ds6zhk334liqf3uhses', label: 'Pressure', sdcType: 'Units' }),
  (comp_oy0jwif5pi86xtimzxzhapvu:XdQuantity:SDC4Component { id: 'mc-oy0jwif5pi86xtimzxzhapvu', label: 'Heart Rate', sdcType: 'XdQuantity', seq: '0000', description: 'Heart Rate (LOINC 8867-4), in the Default units by slot. FHIR Observation.valueQuantity.', minInclusive: '0.00000', totalDigits: '4', fractionDigits: '0' }),
  (comp_r493514xykrtgyz8dyyqjcxg:Units:SDC4Component { id: 'mc-r493514xykrtgyz8dyyqjcxg', label: 'Rate', sdcType: 'Units' }),
  (cluster_x69rhb0rc8sn1e6qkirhcnum:Cluster:SDC4Component { id: 'mc-x69rhb0rc8sn1e6qkirhcnum', label: 'Blood Pressure Reading 1', sdcType: 'Cluster', description: 'The first of the seated blood pressure readings (BPXSY1, BPXDI1): the FHIR blood pressure cluster by identifier. Members: blood-pressure (FHIR).' }),
  (cluster_wyk9e1d74y5xrgv97o9y75ib:Cluster:SDC4Component { id: 'mc-wyk9e1d74y5xrgv97o9y75ib', label: 'Blood Pressure', sdcType: 'Cluster', description: 'A blood pressure reading: systolic and diastolic, body site, status and time.' }),
  (comp_q9vmn1cvdclgr757aer5v1rg:XdToken:SDC4Component { id: 'mc-q9vmn1cvdclgr757aer5v1rg', label: 'Observation Status', sdcType: 'XdToken', seq: '0000', description: 'The status of the observation result. FHIR Observation.status; ObservationStatus, version 4.0.1.', enumerations: 'registered; preliminary; final; amended; corrected; cancelled; entered-in-error; unknown' }),
  (comp_s3qzwxxz9b42lcd2wryok8jd:XdQuantity:SDC4Component { id: 'mc-s3qzwxxz9b42lcd2wryok8jd', label: 'Diastolic Blood Pressure', sdcType: 'XdQuantity', seq: '0000', description: 'Diastolic Blood Pressure (LOINC 8462-4), in the Default units by slot. FHIR Observation.valueQuantity.', minInclusive: '0.00000', totalDigits: '5', fractionDigits: '1' }),
  (comp_r1ve12xphsb5hu2yjmhksw5h:XdQuantity:SDC4Component { id: 'mc-r1ve12xphsb5hu2yjmhksw5h', label: 'Systolic Blood Pressure', sdcType: 'XdQuantity', seq: '0000', description: 'Systolic Blood Pressure (LOINC 8480-6), in the Default units by slot. FHIR Observation.valueQuantity.', minInclusive: '0.00000', totalDigits: '5', fractionDigits: '1' }),
  (comp_dkyyj01tksb7h7akq2w7moum:XdTemporal:SDC4Component { id: 'mc-dkyyj01tksb7h7akq2w7moum', label: 'Observation Date Time', sdcType: 'XdTemporal', seq: '0000', description: 'The clinically relevant time of the observation. FHIR Observation.effectiveDateTime.' }),
  (cluster_r5koa840csi3zcewts0uo0r5:Cluster:SDC4Component { id: 'mc-r5koa840csi3zcewts0uo0r5', label: 'Body Site (SNOMED CT)', sdcType: 'Cluster', description: 'The body site the observation was made on. A coded value: the SNOMED CT code, its display text and the fixed code system, resolved on the code system IRI (FHIR Coding). FHIR Observation.bodySite.' }),
  (comp_q75pzzv36or6dxgjrrbvmun5:XdLink:SDC4Component { id: 'mc-q75pzzv36or6dxgjrrbvmun5', label: 'Code System: SNOMED CT', sdcType: 'XdLink', seq: '0000', description: 'The code system of a coded value, fixed: SNOMED CT (http://snomed.info/sct). FHIR Coding.system.' }),
  (comp_vi7yvq0b8nler3g6alaamrzm:XdString:SDC4Component { id: 'mc-vi7yvq0b8nler3g6alaamrzm', label: 'Body Site Code (SNOMED CT)', sdcType: 'XdString', seq: '0000', description: 'The SNOMED CT code for the body site the observation was made on. FHIR Observation.bodySite, coded in http://snomed.info/sct.', maxLength: '40', pattern: '[0-9]{6,18}' }),
  (comp_eo5tlfr0576ypknys5alvcn0:XdString:SDC4Component { id: 'mc-eo5tlfr0576ypknys5alvcn0', label: 'Code Display Text', sdcType: 'XdString', seq: '0000', description: 'The human-readable display of a coded value, as recorded with the code (FHIR Coding.display).', maxLength: '500' }),
