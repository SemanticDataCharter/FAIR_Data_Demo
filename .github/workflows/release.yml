name: Release

# Push a tag v<version> on main. The workflow refuses a tag that does not match
# app/sdc4/VERSION, runs the tests, builds the web image, pushes it to GHCR as
# ghcr.io/semanticdatacharter/fair-data-demo:<version> (and :latest), and creates the GitHub
# Release with generated notes if one does not already exist.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/semanticdatacharter/fair-data-demo

jobs:
  release:
    name: Check, test, build, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match app/sdc4/VERSION
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < app/sdc4/VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match app/sdc4/VERSION ($file)"; exit 1
          fi
          echo "version=$file" >> "$GITHUB_OUTPUT"

      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag is not on main"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/sdc4/requirements.txt
      - run: pip install -r app/sdc4/requirements.txt
      - name: Tests
        working-directory: app/sdc4
        env:
          SECRET_KEY: ci
          DATABASE_URL: sqlite:////tmp/ci.sqlite3
        run: python manage.py test demo console

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/sdc4/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=FAIR Data Demo
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub Release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "release v$v already exists; leaving its notes alone"
          else
            gh release create "v$v" --verify-tag --title "FAIR Data Demo $v" --generate-notes \
              --notes "Image: \`${IMAGE}:$v\` (\`make pull\` fetches it). Run: \`git checkout v$v && make demo\`."
          fi
