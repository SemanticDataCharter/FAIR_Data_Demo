key: chronic-condition-indicators
label: Chronic Condition Indicators
type: Cluster
description: 'The chronic conditions a study records for a person, one indicator per condition, with the basis on which the study established
  them. NHANES and BRFSS carry the ones their questionnaires ask; CMS carries the eleven its chronic conditions flags define; every study that
  carries an indicator carries the same component. Members: Condition Indicator Basis; Condition: Asthma; Condition: Arthritis; Condition: Congestive
  Heart Failure; Condition: Coronary Heart Disease; Condition: Angina; Condition: Heart Attack; Condition: Stroke; Condition: Emphysema; Condition:
  Chronic Bronchitis; Condition: COPD; Condition: Liver Condition; Condition: Thyroid Problem; Condition: Cancer; Condition: Skin Cancer; Condition:
  Depression; Condition: Kidney Disease; Condition: Diabetes; Condition: Alzheimer''s Disease or Related Disorder; Condition: Osteoporosis; Condition:
  High Blood Pressure; Condition: High Cholesterol.'
