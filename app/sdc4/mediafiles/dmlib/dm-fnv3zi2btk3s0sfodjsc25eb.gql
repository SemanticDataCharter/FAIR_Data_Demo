  // --- Model-enriched structural data ---
  (dm_fnv3zi2btk3s0sfodjsc25eb:DataModel { id: 'dm-fnv3zi2btk3s0sfodjsc25eb', label: 'CMS Beneficiary', sdcType: 'DataModel', description: 'SDC4 data model for CMS DE-SynPUF (Medicare Claims Synthetic Data) (cms_beneficiary) — FAIR Data Demo', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal' }),
  (cluster_io2h28pi3yktedurk8ye3oq0:Cluster:SDC4Component { id: 'mc-io2h28pi3yktedurk8ye3oq0', label: 'CMS Beneficiary Governed Record', sdcType: 'Cluster', description: 'A CMS beneficiary summary record. The governed record: the data cluster, the PROV activity and agent and the audit event from the ProvGov library by identifier. Members: CMS Beneficiary; prov-activity (Provgov); prov-agent (Provgov); audit-event (Provgov).' }),
  (cluster_t2tvd3wylxrstdeu5aw6gkw1:Cluster:SDC4Component { id: 'mc-t2tvd3wylxrstdeu5aw6gkw1', label: 'Audit Event', sdcType: 'Cluster', description: 'A logged access or custody event as data: what was done, by whom, on what, with what outcome and for what purpose. The audit-only case of sdc5 issue 002; state-changing operations are workflow transitions.' }),
  (comp_dkc2ccj5te35z9gd4bu1blcq:XdString:SDC4Component { id: 'mc-dkc2ccj5te35z9gd4bu1blcq', label: 'Audit Agent Reference', sdcType: 'XdString', seq: '0000', description: 'The acting agent (FHIR AuditEvent.agent.who). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_gcjyjrnp0wsfoelcp4m05c67:XdString:SDC4Component { id: 'mc-gcjyjrnp0wsfoelcp4m05c67', label: 'Audit Entity Reference', sdcType: 'XdString', seq: '0000', description: 'The entity the event concerns (FHIR AuditEvent.entity.what). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_fjhgr5fyqxt2crmg2cb5c513:XdString:SDC4Component { id: 'mc-fjhgr5fyqxt2crmg2cb5c513', label: 'Audit Event Identifier', sdcType: 'XdString', seq: '0000', description: 'The identifier of the audit event.', maxLength: '255' }),
  (comp_sndpbhm3xbd6qtbyxmvh3i0e:XdString:SDC4Component { id: 'mc-sndpbhm3xbd6qtbyxmvh3i0e', label: 'Data Subject Reference', sdcType: 'XdString', seq: '0000', description: 'The data subject or patient the event concerns (FHIR AuditEvent.patient; SDC DM.subject). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_nf1air1zbj8v9w66jozdxmyl:XdString:SDC4Component { id: 'mc-nf1air1zbj8v9w66jozdxmyl', label: 'On Behalf Of Reference', sdcType: 'XdString', seq: '0000', description: 'The party on whose behalf the agent acted (FHIR agent.onBehalfOf; prov:actedOnBehalfOf). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_h3kdbvdtyalpvik97saaf0an:XdString:SDC4Component { id: 'mc-h3kdbvdtyalpvik97saaf0an', label: 'System Identifier', sdcType: 'XdString', seq: '0000', description: 'The system that handled the item (FHIR AuditEvent.source.observer; SDC AuditType.system-id).', maxLength: '255' }),
  (comp_ujir739mf1g8ajeczs9nzh9m:XdString:SDC4Component { id: 'mc-ujir739mf1g8ajeczs9nzh9m', label: 'System Location Name', sdcType: 'XdString', seq: '0000', description: 'The site or facility that handled the item (FHIR AuditEvent.agent.location; prov:atLocation).', maxLength: '255' }),
  (comp_ce1c8sydkov8bkv4dgdmwe5x:XdToken:SDC4Component { id: 'mc-ce1c8sydkov8bkv4dgdmwe5x', label: 'Audit Event Action', sdcType: 'XdToken', seq: '0000', description: 'The operation performed in a logged access event (FHIR AuditEvent.action). Read and Execute change no state and are audit facts, not workflow moves.', enumerations: 'C; R; U; D; E' }),
  (comp_rpz1czz06jhpahmfz30rblvp:XdToken:SDC4Component { id: 'mc-rpz1czz06jhpahmfz30rblvp', label: 'Audit Event Outcome', sdcType: 'XdToken', seq: '0000', description: 'The result of an audited event (FHIR AuditEvent.outcome).', enumerations: '0; 4; 8; 12' }),
  (comp_vbctgmdcwps5b3r3l6sboa6y:XdToken:SDC4Component { id: 'mc-vbctgmdcwps5b3r3l6sboa6y', label: 'Confidentiality', sdcType: 'XdToken', seq: '0000', description: 'The level of protection the information requires (HL7 v3 Confidentiality). At assembly the value populates a component\'s act tag.', enumerations: 'U; L; M; N; R; V' }),
  (comp_jujsdur1igws8orw6tvvlqco:XdToken:SDC4Component { id: 'mc-jujsdur1igws8orw6tvvlqco', label: 'Provenance Agent Type', sdcType: 'XdToken', seq: '0000', description: 'The functional role of an agent in an activity (FHIR Provenance.agent.type).', enumerations: 'enterer; performer; author; editor; verifier; legal; attester; informant; custodian; transmitter; assembler; transformer; composer' }),
  (comp_d1evlz8yvdlwt6ia9fjq4pgj:XdToken:SDC4Component { id: 'mc-d1evlz8yvdlwt6ia9fjq4pgj', label: 'Purpose of Use', sdcType: 'XdToken', seq: '0000', description: 'Why the information was used (HL7 v3 ActReason purpose of use). Activity context, not an access-control tag.', enumerations: 'TREAT; ETREAT; COC; HPAYMT; HOPERAT; HRESCH; CLINTRCH; PUBHLTH; PATRQT; HLEGAL; HMARKT' }),
  (comp_uwiosm2q9ym3ewr4de910s70:XdTemporal:SDC4Component { id: 'mc-uwiosm2q9ym3ewr4de910s70', label: 'Audit Recorded At', sdcType: 'XdTemporal', seq: '0000', description: 'When the audit event was recorded (FHIR AuditEvent.recorded).' }),
  (cluster_kkdy1kjdruxvx8s1ra8eh231:Cluster:SDC4Component { id: 'mc-kkdy1kjdruxvx8s1ra8eh231', label: 'CMS Beneficiary', sdcType: 'Cluster', description: 'One DE-SynPUF beneficiary summary for the 2008 reference year: the beneficiary code, demographics, Medicare coverage, the eleven chronic condition indicators on a claims basis with the ESRD indicator, and the year\'s amounts. Members: Beneficiary Code (DESYNPUF_ID); CMS Beneficiary Demographics; CMS Medicare Coverage; Chronic Condition Indicators; End-Stage Renal Disease Indicator (BENE_ESRD_IND); CMS Annual Amounts.' }),
  (comp_zshx6rx7ca1j00eda9kxyh6h:XdString:SDC4Component { id: 'mc-zshx6rx7ca1j00eda9kxyh6h', label: 'Beneficiary Code (DESYNPUF_ID)', sdcType: 'XdString', seq: '0000', description: 'The synthetic beneficiary identifier every DE-SynPUF file carries (DESYNPUF_ID); not traceable to a real Medicare beneficiary.', maxLength: '16', pattern: '[0-9A-F]{16}' }),
  (comp_pczjiz8bjdg20api47gmeq0e:XdToken:SDC4Component { id: 'mc-pczjiz8bjdg20api47gmeq0e', label: 'End-Stage Renal Disease Indicator (BENE_ESRD_IND)', sdcType: 'XdToken', seq: '0000', description: 'Whether the beneficiary has end-stage renal disease (BENE_ESRD_IND).', enumerations: 'Yes; No' }),
  (cluster_wa0mknvfo83hej635n48s0ig:Cluster:SDC4Component { id: 'mc-wa0mknvfo83hej635n48s0ig', label: 'Chronic Condition Indicators', sdcType: 'Cluster', description: 'The chronic conditions a study records for a person, one indicator per condition, with the basis on which the study established them. NHANES and BRFSS carry the ones their questionnaires ask; CMS carries the eleven its chronic conditions flags define; every study that carries an indicator carries the same component. Members: Condition Indicator Basis; Condition: Asthma; Condition: Arthritis; Condition: Congestive Heart Failure; Condition: Coronary Heart Disease; Condition: Angina; Condition: Heart Attack; Condition: Stroke; Condition: Emphysema; Condition: Chronic Bronchitis; Condition: COPD; Condition: Liver Condition; Condition: Thyroid Problem; Condition: Cancer; Condition: Skin Cancer; Condition: Depression; Condition: Kidney Disease; Condition: Diabetes; Condition: Alzheimer\'s Disease or Related Disorder; Condition: Osteoporosis; Condition: High Blood Pressure; Condition: High Cholesterol.' }),
  (comp_d9z9mcx6gs9zbz4k6f0v738s:XdToken:SDC4Component { id: 'mc-d9z9mcx6gs9zbz4k6f0v738s', label: 'Condition: Alzheimer\'s Disease or Related Disorder', sdcType: 'XdToken', seq: '0000', description: 'Whether the person has alzheimer\'s disease or related disorder (Alzheimer\'s Disease or Related Disorder, SNOMED CT 26929004), on the basis the record states in its Condition Indicator Basis: told by a health professional, or found in claims. Carried by CMS SP_ALZHDMTA.', enumerations: 'Yes; No' }),
  (comp_o4d67oubyyunugx3la44f53u:XdToken:SDC4Component { id: 'mc-o4d67oubyyunugx3la44f53u', label: 'Condition: Angina', sdcType: 'XdToken', seq: '0000', description: 'Whether the person has angina (Angina, SNOMED CT 194828000), on the basis the record states in its Condition Indicator Basis: told by a health professional, or found in claims. Carried by NHANES MCQ160D.', enumerations: 'Yes; No' }),
  (comp_nd1v8jk7wtm1tthzw1f4987t:XdToken:SDC4Component { id: 'mc-nd1v8jk7wtm1tthzw1f4987t', label: 'Condition: Arthritis', sdcType: 'XdToken', seq: '0000', description: 'Whether the person has arthritis (Arthritis, SNOMED CT 3723001), on the basis the record states in its Condition Indicator Basis: told by a health professional, or found in claims. Carried by NHANES MCQ160A, BRFSS HAVARTH4, CMS SP_RA_OA.', enumerations: 'Yes; No' }),
  (comp_acr1xvqppf1b3rjsrst6tt4p:XdToken:SDC4Component { id: 'mc-acr1xvqppf1b3rjsrst6tt4p', label: 'Condition: Asthma', sdcType: 'XdToken', seq: '0000', description: 'Whether the person has asthma (Asthma, SNOMED CT 195967001), on the basis the record states in its Condition Indicator Basis: told by a health professional, or found in claims. Carried by NHANES MCQ010, BRFSS ASTHMA3.', enumerations: 'Yes; No' }),
  (comp_ix0my2v2z79s002g0r8orosf:XdToken:SDC4Component { id: 'mc-ix0my2v2z79s002g0r8orosf', label: 'Condition: Cancer', sdcType: 'XdToken', seq: '0000', description: 'Whether the person has cancer (Cancer, SNOMED CT 363346000), on the basis the record states in its Condition Indicator Basis: told by a health professional, or found in claims. Carried by NHANES MCQ220, BRFSS CHCOCNC1, CMS SP_CNCR.', enumerations: 'Yes; No' }),
  (comp_jyx7rxfktazhgxgq84fxf6wr:XdToken:SDC4Component { id: 'mc-jyx7rxfktazhgxgq84fxf6wr', label: 'Condition: Chronic Bronchitis', sdcType: 'XdToken', seq: '0000', description: 'Whether the person has chronic bronchitis (Chronic Bronchitis, SNOMED CT 63480004), on the basis the record states in its Condition Indicator Basis: told by a health professional, or found in claims. Carried by NHANES MCQ160K.', enumerations: 'Yes; No' }),
  (comp_hyqlz591lhj54sdt1a1mup70:XdToken:SDC4Component { id: 'mc-hyqlz591lhj54sdt1a1mup70', label: 'Condition: Congestive Heart Failure', sdcType: 'XdToken', seq: '0000', description: 'Whether the person has congestive heart failure (Congestive Heart Failure, SNOMED CT 42343007), on the basis the record states in its Condition Indicator Basis: told by a health professional, or found in claims. Carried by NHANES MCQ160B, CMS SP_CHF.', enumerations: 'Yes; No' }),
