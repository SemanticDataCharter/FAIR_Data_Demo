  (comp_dchiej5tv7tyhfwr6h3ync1i:XdQuantity:SDC4Component { id: 'mc-dchiej5tv7tyhfwr6h3ync1i', label: 'Body Mass Index', sdcType: 'XdQuantity', seq: '0000', description: 'Body mass index (LOINC 39156-5) in kg/m2. FHIR Observation.valueQuantity.', minInclusive: '0.00000', totalDigits: '4', fractionDigits: '1' }),
