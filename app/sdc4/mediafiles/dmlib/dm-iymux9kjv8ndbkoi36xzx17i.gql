  (cluster_oqw3pnwhf8knpgsfo8k3xojn:Cluster:SDC4Component { id: 'mc-oqw3pnwhf8knpgsfo8k3xojn', label: 'BRFSS Demographics', sdcType: 'Cluster', description: 'The respondent\'s demographics: the Default administrative gender and the BRFSS sex code, the NIH CDE age and the agency\'s imputed age, race/ethnicity as the NIH CDE and as BRFSS imputes it, education, marital status, employment and insurance as the NIH CDE and as BRFSS codes them, veteran status, pregnancy, children in the household and the agency\'s income range. Members: administrative-gender (Default); Sex of Respondent (SEXVAR); Age (NIH CDE); Imputed Age Value Collapsed Above 80 (_AGE80); Race/Ethnicity Self-Identification (NIH CDE); Imputed Race/Ethnicity Value (_IMPRACE); Current Educational Attainment (NIH CDE); Education Level (EDUCA); Marital Status (NIH CDE); Marital Status (MARITAL); Employment Status (NIH CDE); Employment Status (EMPLOY1); Category of Health Insurance (NIH CDE); Primary Source of Health Insurance (PRIMINSR); Veteran Status; Are you pregnant now? (NIH CDE); Pregnancy Status (PREGNANT); Number of Children in Household (CHILDREN); Income Level (INCOME3).' }),
