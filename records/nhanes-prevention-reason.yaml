key: nhanes-prevention-reason
label: Prevention Reason (NHANES)
type: Cluster
description: 'A reason for a medicine coded in NHANES''s prevention reason codes: the code, NHANES''s description of it and the fixed code system
  (FHIR Coding). Kept apart from the ICD-10-CM diagnosis because the code is not ICD-10-CM and the condition is one the participant is preventing,
  not one diagnosed. Members: Prevention Reason Code (NHANES); code-display-text (FHIR); Code System: NHANES Prevention Reason.'
