key: diagnosis-icd9cm-code
label: Diagnosis Code (ICD-9-CM)
type: XdString
description: An ICD-9-CM diagnosis code as recorded on a 2008-2010 Medicare claim, without the decimal point as CMS files carry it.
source:
  name: ICD-9-CM
links:
- predicate: skos:exactMatch
  iri: http://hl7.org/fhir/sid/icd-9-cm
  basis: standard
constraints:
  max_length: 5
  str_fmt: '[0-9EV][0-9]{2,4}'
