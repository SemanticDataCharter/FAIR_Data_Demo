name: CI

# Every pull request and every push to dev or main: the unit tests, the compose
# file, and a build of the web image. The data load is not here on purpose; it
# needs GraphDB and Postgres and thirty minutes, and the dataset is deterministic.

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (demo, console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/sdc4/requirements.txt
      - name: Upgrade pip by hash (eMudhra/emSign CA compromise, October 2026)
        # Older pip vendors a certifi that trusts the compromised emSign root; fetch the fix from a pinned hash.
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: pip install -r app/sdc4/requirements.txt
      - name: Run the tests against SQLite (the tests do not touch the database)
        working-directory: app/sdc4
        env:
          SECRET_KEY: ci
          DATABASE_URL: sqlite:////tmp/ci.sqlite3
        run: python manage.py test demo console --verbosity 2

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f app/sdc4/docker-compose.yml config --quiet

  image:
    name: Web image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/sdc4/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
