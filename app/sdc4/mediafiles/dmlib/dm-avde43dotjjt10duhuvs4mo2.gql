  (comp_doxdajuj6j1mk480zd1k7ssz:XdQuantity:SDC4Component { id: 'mc-doxdajuj6j1mk480zd1k7ssz', label: 'Body Weight', sdcType: 'XdQuantity', seq: '0000', description: 'Body Weight (LOINC 29463-7), in the Default units by slot. FHIR Observation.valueQuantity.', minInclusive: '0.00000', totalDigits: '6', fractionDigits: '2' }),
