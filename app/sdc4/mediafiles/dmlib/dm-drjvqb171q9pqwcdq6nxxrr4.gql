  (comp_u5tietya3u56hbz2kos06ai7:XdToken:SDC4Component { id: 'mc-u5tietya3u56hbz2kos06ai7', label: 'Race/Ethnicity Self-Identification', sdcType: 'XdToken', seq: '0000', description: 'A textual description of a person\'s race. C17049 |The ethnicity of a person. C16564 | An individual\'s perspective or subjective interpretation of an event or information. C74528 Question text: Please select the racial/ethnic category or categories with which you most closely identify. Select all that apply. NIH CDE Repository, steward NIMHD, tinyId LakF0YkywC, NIH endorsed.', enumerations: 'American Indian or Alaska Native; Asian or Asian American; Black or African American; Hispanic, Latino, or Spanish; Native Hawaiian or Other Pacific Islander; Middle Eastern or North African; White' }),
