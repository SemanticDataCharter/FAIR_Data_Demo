description: 'The six disability questions: hearing, vision, cognition, mobility, self-care and independent living. Members: Deaf or Serious Difficulty
  Hearing (DEAF); Blind or Serious Difficulty Seeing (BLIND); Serious Difficulty Concentrating, Remembering or Deciding (DECIDE); Serious Difficulty
  Walking or Climbing Stairs (DIFFWALK); Difficulty Dressing or Bathing (DIFFDRES); Difficulty Doing Errands Alone (DIFFALON).'
