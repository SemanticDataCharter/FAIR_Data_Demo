  // --- Model-enriched structural data ---
  (dm_z5cw245lvxw7atrbgqukyvbh:DataModel { id: 'dm-z5cw245lvxw7atrbgqukyvbh', label: 'CMS Beneficiary 4.3.1', sdcType: 'DataModel', description: 'SDC4 data model for CMS DE-SynPUF (Medicare Claims Synthetic Data) (cms_beneficiary) — FAIR Data Demo', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal' }),
  (cluster_ato6pp0mrjbydfemm372jvx0:Cluster:SDC4Component { id: 'mc-ato6pp0mrjbydfemm372jvx0', label: 'CMS Beneficiary Governed Record', sdcType: 'Cluster', description: 'A CMS beneficiary summary record. The governed record: the data cluster, the PROV activity and agent and the audit event from the ProvGov library by identifier. Members: CMS Beneficiary; prov-activity (Provgov); prov-agent (Provgov); audit-event (Provgov).' }),
  (cluster_t2tvd3wylxrstdeu5aw6gkw1:Cluster:SDC4Component { id: 'mc-t2tvd3wylxrstdeu5aw6gkw1', label: 'Audit Event', sdcType: 'Cluster', description: 'A logged access or custody event as data: what was done, by whom, on what, with what outcome and for what purpose. The audit-only case of sdc5 issue 002; state-changing operations are workflow transitions.' }),
  (comp_dkc2ccj5te35z9gd4bu1blcq:XdString:SDC4Component { id: 'mc-dkc2ccj5te35z9gd4bu1blcq', label: 'Audit Agent Reference', sdcType: 'XdString', seq: '0000', description: 'The acting agent (FHIR AuditEvent.agent.who). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_gcjyjrnp0wsfoelcp4m05c67:XdString:SDC4Component { id: 'mc-gcjyjrnp0wsfoelcp4m05c67', label: 'Audit Entity Reference', sdcType: 'XdString', seq: '0000', description: 'The entity the event concerns (FHIR AuditEvent.entity.what). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_fjhgr5fyqxt2crmg2cb5c513:XdString:SDC4Component { id: 'mc-fjhgr5fyqxt2crmg2cb5c513', label: 'Audit Event Identifier', sdcType: 'XdString', seq: '0000', description: 'The identifier of the audit event.', maxLength: '255' }),
  (comp_sndpbhm3xbd6qtbyxmvh3i0e:XdString:SDC4Component { id: 'mc-sndpbhm3xbd6qtbyxmvh3i0e', label: 'Data Subject Reference', sdcType: 'XdString', seq: '0000', description: 'The data subject or patient the event concerns (FHIR AuditEvent.patient; SDC DM.subject). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_nf1air1zbj8v9w66jozdxmyl:XdString:SDC4Component { id: 'mc-nf1air1zbj8v9w66jozdxmyl', label: 'On Behalf Of Reference', sdcType: 'XdString', seq: '0000', description: 'The party on whose behalf the agent acted (FHIR agent.onBehalfOf; prov:actedOnBehalfOf). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_h3kdbvdtyalpvik97saaf0an:XdString:SDC4Component { id: 'mc-h3kdbvdtyalpvik97saaf0an', label: 'System Identifier', sdcType: 'XdString', seq: '0000', description: 'The system that handled the item (FHIR AuditEvent.source.observer; SDC AuditType.system-id).', maxLength: '255' }),
  (comp_ujir739mf1g8ajeczs9nzh9m:XdString:SDC4Component { id: 'mc-ujir739mf1g8ajeczs9nzh9m', label: 'System Location Name', sdcType: 'XdString', seq: '0000', description: 'The site or facility that handled the item (FHIR AuditEvent.agent.location; prov:atLocation).', maxLength: '255' }),
  (comp_ce1c8sydkov8bkv4dgdmwe5x:XdToken:SDC4Component { id: 'mc-ce1c8sydkov8bkv4dgdmwe5x', label: 'Audit Event Action', sdcType: 'XdToken', seq: '0000', description: 'The operation performed in a logged access event (FHIR AuditEvent.action). Read and Execute change no state and are audit facts, not workflow moves.', enumerations: 'C; R; U; D; E' }),
  (comp_rpz1czz06jhpahmfz30rblvp:XdToken:SDC4Component { id: 'mc-rpz1czz06jhpahmfz30rblvp', label: 'Audit Event Outcome', sdcType: 'XdToken', seq: '0000', description: 'The result of an audited event (FHIR AuditEvent.outcome).', enumerations: '0; 4; 8; 12' }),
  (comp_vbctgmdcwps5b3r3l6sboa6y:XdToken:SDC4Component { id: 'mc-vbctgmdcwps5b3r3l6sboa6y', label: 'Confidentiality', sdcType: 'XdToken', seq: '0000', description: 'The level of protection the information requires (HL7 v3 Confidentiality). At assembly the value populates a component\'s act tag.', enumerations: 'U; L; M; N; R; V' }),
  (comp_jujsdur1igws8orw6tvvlqco:XdToken:SDC4Component { id: 'mc-jujsdur1igws8orw6tvvlqco', label: 'Provenance Agent Type', sdcType: 'XdToken', seq: '0000', description: 'The functional role of an agent in an activity (FHIR Provenance.agent.type).', enumerations: 'enterer; performer; author; editor; verifier; legal; attester; informant; custodian; transmitter; assembler; transformer; composer' }),
  (comp_d1evlz8yvdlwt6ia9fjq4pgj:XdToken:SDC4Component { id: 'mc-d1evlz8yvdlwt6ia9fjq4pgj', label: 'Purpose of Use', sdcType: 'XdToken', seq: '0000', description: 'Why the information was used (HL7 v3 ActReason purpose of use). Activity context, not an access-control tag.', enumerations: 'TREAT; ETREAT; COC; HPAYMT; HOPERAT; HRESCH; CLINTRCH; PUBHLTH; PATRQT; HLEGAL; HMARKT' }),
  (comp_uwiosm2q9ym3ewr4de910s70:XdTemporal:SDC4Component { id: 'mc-uwiosm2q9ym3ewr4de910s70', label: 'Audit Recorded At', sdcType: 'XdTemporal', seq: '0000', description: 'When the audit event was recorded (FHIR AuditEvent.recorded).' }),
  (cluster_asc6mbhsfc9esm4lc9kc64ic:Cluster:SDC4Component { id: 'mc-asc6mbhsfc9esm4lc9kc64ic', label: 'CMS Beneficiary', sdcType: 'Cluster', description: 'One DE-SynPUF beneficiary summary for the 2008 reference year: the beneficiary code, demographics, Medicare coverage, the eleven chronic condition indicators on a claims basis with the ESRD indicator, and the year\'s amounts. Members: Beneficiary Code (DESYNPUF_ID); CMS Beneficiary Demographics; CMS Medicare Coverage; Chronic Condition Indicators; End-Stage Renal Disease Indicator (BENE_ESRD_IND); CMS Annual Amounts.' }),
  (comp_zshx6rx7ca1j00eda9kxyh6h:XdString:SDC4Component { id: 'mc-zshx6rx7ca1j00eda9kxyh6h', label: 'Beneficiary Code (DESYNPUF_ID)', sdcType: 'XdString', seq: '0000', description: 'The synthetic beneficiary identifier every DE-SynPUF file carries (DESYNPUF_ID); not traceable to a real Medicare beneficiary.', maxLength: '16', pattern: '[0-9A-F]{16}' }),
