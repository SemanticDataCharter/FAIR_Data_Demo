key: cms-prescription-drug-event
label: CMS Prescription Drug Event
type: Cluster
description: 'One DE-SynPUF Part D prescription drug event (2008-2010): the beneficiary and event identifiers, the service date, the product as
  an NDC coded value, quantity, days supply, and the patient pay and total cost amounts. Members: Beneficiary Code (DESYNPUF_ID); Prescription
  Drug Event ID (PDE_ID); Service Date (SRVC_DT); Product (NDC); Quantity Dispensed (QTY_DSPNSD_NUM); Days Supply (DAYS_SUPLY_NUM); Patient Pay
  Amount; Total Prescription Cost.'
source:
  name: CMS DE-SynPUF
links:
- predicate: skos:exactMatch
  iri: http://hl7.org/fhir/StructureDefinition/MedicationDispense
  basis: standard
members:
- cms-beneficiary-code
- cms-prescription-drug-event-id
- cms-service-date
- product-ndc
- cms-quantity-dispensed
- cms-days-supply
- cms-patient-pay-amount
- cms-total-prescription-cost
